name: Daily Weather Report

on:
  # Triggers whenever you push to main or master
  push:
    branches:
      - main
      - master

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

  # Scheduled run every day at 01:00 UTC (06:30 AM IST)
  schedule:
    - cron: '0 1 * * *'

jobs:
  weather-email:
    name: Fetch Weather & Send Email
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather Script
        env:
          GMAIL_USER: "balaramanperumal91@gmail.com"
          GMAIL_APP_PASSWORD: "xpdh dpku ssut fcnq"
          RECIPIENT_EMAIL: "sulochanakumar06@gmail.com"
        run: |
          python weather.py
